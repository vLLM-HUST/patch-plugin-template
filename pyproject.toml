[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "example-plugin"
dynamic = ["version"]
description = "Template: a default-off, single-mechanism runtime-patch plugin for vLLM-HUST"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff", "tomli>=2; python_version < '3.11'"]

[project.entry-points."vllm.general_plugins"]
example_plugin = "example_plugin.plugin:register"

[project.entry-points."vllm_hust.extension_bundles"]
"org.vllm-hust.example-plugin" = "example_plugin.manifests"

[tool.setuptools.dynamic]
version = {attr = "example_plugin._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
example_plugin = ["manifests/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
